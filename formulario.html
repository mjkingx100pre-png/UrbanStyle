<!doctype html>
<html lang="es">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Urban Style</title>
    <link rel="stylesheet" href="catalogo/css/home/formulario.css">
    </head>
    <body>
    <section class="formulario">
        <div class="izquierda">
        <img src="catalogo/image/home/fondo_form.png" alt="Urban Style" />
        </div>

        <div class="derecha">
        <h1>FORMULARIO</h1>
        <p>Completa el formulario y te responderemos lo antes posible.</p>

        <input type="text" placeholder="Nombre completo" />
        <input type="email" placeholder="Correo electrónico" />
        <input type="tel" placeholder="Teléfono" />
        <textarea rows="5" placeholder="Mensaje"></textarea>

        <button><a href="gracias.html">ENVIAR MENSAJE</a></button>
        </div>
    </section>
    </body>
</html>
