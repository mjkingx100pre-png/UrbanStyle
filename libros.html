<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro de Reclamaciones | Urban Style</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
    text-decoration: none;
    list-style: none;
}

body{
    background:#f5f5f5;
}

.contenedor{
    max-width:900px;
    margin:50px auto;
    background:#fff;
    padding:40px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:10px;
}

p{
    text-align:center;
    margin-bottom:30px;
    color:#666;
}

form{
    display:grid;
    gap:15px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
}

textarea{
    resize:none;
}
.contenedor .btn-reclamo{
    color: #f5f5f5;
    font-size: 18px;
}
button{
    background:#d4a017;
    color:white;
    border:none;
    padding:15px;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
    
}

button:hover{
    background:#684f0f;
}

</style>
</head>

<body>

<div class="contenedor">

    <h1>Libro de Reclamaciones</h1>

    <p>
    Conforme al Código de Protección y Defensa del Consumidor,
    este establecimiento cuenta con un Libro de Reclamaciones Virtual.
    </p>

    <form>

    <input type="text" placeholder="Nombres y Apellidos" required>

    <input type="text" placeholder="DNI" required>

    <input type="email" placeholder="Correo Electrónico" required>

    <input type="tel" placeholder="Teléfono" required>

    <select required>
    <option value="">Seleccione tipo</option>
    <option>Reclamo</option>
    <option>Queja</option>
    </select>

    <input type="text" placeholder="Producto o Servicio" required>

    <textarea rows="6"
    placeholder="Describe tu reclamo o queja"
    required></textarea>

    <button type="submit">
    <a class="btn-reclamo" href="Inicio.html">Enviar Reclamación</a>
    </button>

    </form>

</div>

</body>
</html>
